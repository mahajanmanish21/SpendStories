[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spendstories"
version = "0.1.0"
description = "Local, offline analysis of credit card and bank statements: categories, trends and spikes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.10",
    "msoffcrypto-tool>=5.0",   # opens password-protected Excel statements (in memory)
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
spendstories = "spendstories.cli:main"

[tool.setuptools.packages.find]
include = ["spendstories*"]

[tool.setuptools.package-data]
spendstories = ["*.toml", "app/*.js", "app/*.css"]
