# SpendStories default categorisation rules.
#
# Rules are checked top to bottom; the first category with a matching keyword
# wins. Keywords are case-insensitive. Keywords of 5+ characters match anywhere
# in the description (so "swiggy" matches "UPI/SWIGGYINSTAMART/123"); shorter
# ones must appear as a separate word (so "ola" does not match "coca cola").
# Prefix a keyword with "re:" to use a regular expression.
#
# kind controls how a category counts:
#   expense    (default) counted as spending; credits in it count as refunds
#   transfer   moving your own money (card bill payments, self transfers) - ignored
#   investment money set aside (SIPs, brokerage) - shown separately, not spending
#   income     salary, interest, dividends
#
# Don't edit this file to customise - copy the sections you want into your own
# rules file and pass it with --rules. Your rules are checked first.

[categories."Transfers & Card Payments"]
kind = "transfer"
keywords = [
  "payment received", "payment - thank you", "payment thank you", "thank you for your payment",
  "autopay", "auto pay", "auto debit cc", "credit card payment", "cc payment", "card payment",
  "bill payment - credit card", "cred club", "credclub", "billdesk cc", "ccpayment",
  "self transfer", "own account", "transfer to self", "sweep", "fd booked", "fd closure",
  "re:\\bto self\\b", "re:\\binternal transfer\\b", "re:\\bonline payment\\b.*\\bcard\\b",
  "re:^payment\\b", "re:\\bepay\\b", "re:\\bach credit card\\b",
]

